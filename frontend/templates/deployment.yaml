apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  namespace: my-namespace
  labels: 
    app: frontend-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-app
          image: chandrumm/pharnaapp:sha-4288ed1
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 5000
